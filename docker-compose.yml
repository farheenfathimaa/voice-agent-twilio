services:
  agent:
    build: .
    image: voice-agent-twilio:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # talk to the companion mock CRM service, not localhost
      CRM_BASE_URL: http://mock-crm:8001
      # keep the image lightweight; set to "auto" to enable fastembed retrieval
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-hashing}
    depends_on:
      - mock-crm
    restart: unless-stopped

  mock-crm:
    build: .
    image: voice-agent-twilio:latest
    command: uvicorn mock_crm.server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
